<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h5="http://xmlns.jcp.org/jsf/passthrough">

<ui:component>
	<div class="row p-3">

		<div class="col-12">
			<p:staticMessage severity="warn" summary="WARN"
				rendered="#{userChaletCardController.chalet.postStatus == 'REFFUSED'}"
				detail="#{userChaletCardController.chalet.reffuseCause}"
				style="width: 100%" />

			<p:staticMessage severity="warn" summary="WARN"
				rendered="#{userChaletCardController.chalet.postStatus == 'TO_REVIEUX_BY_USER'}"
				detail="#{userChaletCardController.chalet.reffuseCause}"
				style="width: 100%" />

			<p:staticMessage
				rendered="#{userChaletCardController.showChaletStatus()}"
				styleClass="col-12 #{userChaletCardController.chalet.postStatus == 'ACCEPTED'? 'accepted' : ''}"
				severity="warn"
				detail="#{bundle[userChaletCardController.chalet.postStatus]}"
				style="overflow: overlay;" />
		</div>


		<h:panelGroup id="chaletphotos" styleClass="col-md-4 pt-3"
			layout="block">
			<p:remoteCommand name="rc"
				actionListener="#{userChaletCardController.changeActiveIndex}"
				oncomplete="PF('chaletgalleriawgvar').show()" />

			<p:graphicImage
				url="#{userChaletCardController.displayFirstImageChalet()}"
				alt="#{bundle.no_photos}"
				style="width: 100%;max-height: 16rem;display: block;object-fit:cover;" />

			<p:galleria styleClass="galleria-arabic-fix"
				widgetVar="chaletgalleriawgvar"
				value="#{userChaletCardController.chalet.images}" var="photo"
				numVisible="4" id="chaletGalleria"
				responsiveOptions="#{userChaletCardController.responsiveOptions1}"
				circular="true" fullScreen="true" showItemNavigators="true"
				showThumbnails="false" style="max-width: 40%">
				<p:graphicImage styleClass="gallery-item mt-2"
					url="#{userChaletCardController.fullUrl}#{photo}" alt="the photos"
					style="width: 100%; display: block" />
				<p:commandButton process="@this" value="#{bundle.delete}"
					onclick="closeGalleria();"
					action="#{userChaletCardController.deleteChaletPhoto(photo)}"
					update="myForm:chaletphotos" />
			</p:galleria>

			<p:commandButton value="#{bundle.show_photos}" partialSubmit="true"
				styleClass=" col-12" icon="pi pi-external-link"
				rendered="#{not empty userChaletCardController.chalet.images}"
				onclick="PF('chaletgalleriawgvar').show();" process="@this" />
		</h:panelGroup>

		<h:panelGroup id="chaletInputPanel" styleClass="row p-3 col-md-8"
			layout="block">
			<div class="col-md-3">
				<div class="form-group">
					<p:outputLabel class="control-label" for="nameId"
						value="#{bundle.chalet_name}">
					</p:outputLabel>
					<h:inputText id="nameId" label="#{bundle.chalet_name}"
						styleClass="form-control"
						value="#{userChaletCardController.chalet.name}">
					</h:inputText>
				</div>
			</div>
			<div class="col-md-3 ">
				<h:outputLabel value="#{bundle.village}" styleClass="control-label" />
				<p:selectOneMenu id="villagechaletId" filter="true" style="min-width: 101px;"
					filterMatchMode="contains" filterNormalize="true"
					converter="omnifaces.SelectItemsConverter" styleClass="form-select"
					value="#{userChaletCardController.chalet.village}">
					<f:selectItem itemLabel="#{bundle.village}" itemValue="" />
					<f:selectItems value="#{userChaletCardController.villages}"
						var="option"
						itemLabel="#{languageController.locale eq 'en' ? option.name :option.nameAr}"
						itemValue="#{option}" />
					<f:ajax execute="@this" />
				</p:selectOneMenu>
			</div>
			<div class="col-md-3">
				<div class="form-group">
					<p:outputLabel class="control-label" for="weekdayId"
						value="#{bundle.chalet_weekdays}">
					</p:outputLabel>
					<p:inputNumber decimalPlaces="0" thousandSeparator=","
						onfocus="selectAllContent(this)" leadingZero="deny"
						symbolPosition="p" minValue="0" maxValue="9999999999"
						placeholder="#{bundle.chalet_weekdays}" id="weekdayId"
						emptyValue="0" label="#{bundle.chalet_weekdays}"
						styleClass="form-control"
						value="#{userChaletCardController.chalet.weekdays}">
					</p:inputNumber>
				</div>
			</div>
			<div class="col-md-3">
				<div class="form-group">
					<p:outputLabel class="control-label" for="weekendId"
						value="#{bundle.chalet_weekenddays}">
					</p:outputLabel>
					<p:inputNumber decimalPlaces="0" thousandSeparator=","
						onfocus="selectAllContent(this)" leadingZero="deny"
						symbolPosition="p" minValue="0" maxValue="9999999999"
						placeholder="#{bundle.chalet_weekenddays}" id="weekendId"
						emptyValue="0" label="#{bundle.chalet_weekenddays}"
						styleClass="form-control"
						value="#{userChaletCardController.chalet.weekenddays}">
					</p:inputNumber>
				</div>
			</div>
			<div class="col-md-3">
				<div class="form-group">
					<h:outputLabel value="#{bundle.chalet_chimney}"
						styleClass="control-label" for="chimneyId" />
					<div class="skin mt-2">
						<h:selectBooleanCheckbox style="height:20px;width:25px"
							label="#{bundle.chalet_chimney}" id="chimneyId"
							value="#{userChaletCardController.chalet.chimney}">
						</h:selectBooleanCheckbox>
					</div>
				</div>
			</div>
			<div class="col-md-3">
				<div class="form-group">
					<h:outputLabel value="#{bundle.chalet_pool}"
						styleClass="control-label" for="poolId" />
					<div class="skin mt-2">
						<h:selectBooleanCheckbox style="height:20px;width:25px"
							label="#{bundle.chalet_pool}" id="poolId"
							value="#{userChaletCardController.chalet.pool}">
						</h:selectBooleanCheckbox>
					</div>
				</div>
			</div>
			<div class="col-md-3">
				<div class="form-group">
					<h:outputLabel value="#{bundle.need_boost}"
						styleClass="control-label" />
					<div class="skin mt-2">
						<h:selectBooleanCheckbox style="height:20px;width:25px"
							label="#{bundle.need_boost}"
							value="#{userChaletCardController.chalet.pendingBoost}">
							<f:ajax></f:ajax>
						</h:selectBooleanCheckbox>
					</div>
				</div>
			</div>
			<div class="col-md-3">
				<div class="form-group">
					<h:outputLabel value="#{bundle.need_verfied}"
						styleClass="control-label" />
					<div class="skin mt-2">
						<h:selectBooleanCheckbox style="height:20px;width:25px"
							label="#{bundle.need_verfied}"
							value="#{userChaletCardController.chalet.needVerified}">
							<f:ajax></f:ajax>
						</h:selectBooleanCheckbox>
					</div>
				</div>
			</div>

			<div class="col-md-12">
				<div class="form-group">

					<p:outputLabel class="control-label" for="descrptionId"
						value="#{bundle.chalet_description}">
					</p:outputLabel>
					<h:inputTextarea id="descrptionId" rows="10"
						label="#{bundle.chalet_description}" styleClass="form-control"
						h5:placeHolder="#{bundle.chalet_description}"
						value="#{userChaletCardController.chalet.descrption}">
					</h:inputTextarea>
				</div>
			</div>


			<div class="col-12">
				<p style="color: #00a780; background-color: #e6f8f4;"
					class="bi-info-circle-fill   accordion-item p-0 mt-2 px-2 mb-0">
					<span class="mx-2">#{bundle.you_can_choose_3_to_5_photos}</span>
				</p>
			</div>
			<h:panelGroup id="uploadPanelChaletId">
				<div class="col-md-12 mt-3">
					<p:fileUpload id="uploadImageChalet" styleClass="  btn-upload"
						rendered="#{userChaletCardController.photosChaletAvailable()}"
						label="#{bundle.choose_photos}" uploadLabel="#{bundle.upload}"
						cancelLabel="#{bundle.cancel}" update=":messageScript"
						fileLimitMessage="#{bundle.YOU_EXCEED_THE_LIMIT_SIZE_OF_PHOTOS}"
						fileLimit="#{userChaletCardController.nbPhotosChaletAvailable()}"
						listener="#{userChaletCardController.handleFileUploadChalet}"
						mode="advanced" dragDropSupport="false" multiple="true"
						allowTypes="/(\.|\/)(gif|jpe?g|png)$/">
					</p:fileUpload>
				</div>
			</h:panelGroup>
			<div class="d-flex  flex-row-reverse">
				<div class="form-group mt-2">
					<h:commandLink value='#{bundle.save}' id="save_btn"
						action='#{userChaletCardController.save()}'
						styleClass="btn btn-primary btn-save">
						<f:ajax render=":messageScript"
							execute="myForm:chaletInputPanel" />
						<i class="fa fa-save" />
					</h:commandLink>
				</div>
			</div>
		</h:panelGroup>
	</div>
</ui:component>
</html>
